<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHẾ ĐÁ</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Cấu hình chung */
        body, html { 
            margin: 0; 
            padding: 0; 
            font-family: 'Quicksand', sans-serif; 
            scroll-behavior: smooth; 
            overflow-x: hidden; 
            background: #f4f4f9;
        }
        
        /* GIAI ĐOẠN 1: Màn hình chào */
        .welcome-screen {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.3)), 
                        url('./image/bgr.png'); 
            background-size: cover;
            background-position: center;
            color: white;
            text-align: center;
            position: relative;
        }

        .cloud-btn-container {
            position: relative;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 20px; 
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.2));
            animation: float 3s ease-in-out infinite;
        }

        .cloud-btn-container:hover { 
            transform: scale(1.15); 
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.3));
        }

        .cloud-base {
            width: 160px;
            height: 70px;
            background: white;
            border-radius: 50px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 -5px 10px rgba(0,0,0,0.05);
        }

        .cloud-base::before, .cloud-base::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 50%;
        }

        .cloud-base::before { width: 80px; height: 80px; top: -40px; left: 20px; }
        .cloud-base::after { width: 100px; height: 100px; top: -55px; right: 15px; }

        .btn-enter-text {
            font-size: 24px;
            font-weight: bold;
            color: #4ed190;
            z-index: 10;
            letter-spacing: 2px;
        }

        .arrow { 
            font-size: 40px; 
            margin-top: 30px; 
            animation: bounce 2s infinite; 
            color: white;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.3));
        }
        
        /* GIAI ĐOẠN 2: Nội dung chính */
        .content-screen {
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .card {
            background: linear-gradient(135deg, #dff5f0 0%, #e0e7ff 100%);
            width: 100%;
            max-width: 500px;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            animation: fadeInUp 1s ease-out;
            box-sizing: border-box;
        }

        .main-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 36px;
            color: #265871;
            text-align: center;
            margin: 0 0 25px 0;
            animation: glow 2s ease-in-out infinite alternate;
            letter-spacing: 1px;   /* giãn chữ */
            line-height: 1.2;
        }

        .video-container {
            width: 100%;
            max-width: 320px; 
            margin: 0 auto 25px;
            border-radius: 20px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            border: 4px solid rgba(255, 255, 255, 0.4);
            aspect-ratio: 9 / 16; 
            position: relative;
        }

        .video-container iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
            object-fit: cover; 
        }

        .section-label {
            font-size: 20px;
            font-weight: 700;
            color: #0c6a70;
            margin-bottom: 15px;
            text-align: center;
        }

        .selection-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-select {
            flex: 1;
            padding: 14px;
            border: 2px solid transparent;
            background: rgba(255, 255, 255, 0.3); 
            color: #0c6a70;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .btn-select.active { 
            background: #0f828a;
            color: white;
            box-shadow: 0 8px 15px rgba(15, 130, 138, 0.3);
            transform: translateY(-3px);
        }

        .image-placeholder {
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            transition: all 0.4s ease;
        }

        /* --- PHẦN GÓP Ý ĐƯỢC NÂNG CẤP --- */
        .feedback-container {
            background: rgba(255,255,255,0.5); 
            backdrop-filter: blur(15px); 
            padding: 25px; 
            border-radius: 25px; 
            border: 1px solid rgba(255,255,255,0.6);
            margin-top: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        .feedback-title {
            font-family: 'Pacifico', cursive;
            font-size: 24px;
            color: #0f828a;
            text-align: center;
            margin-bottom: 10px;
        }

        .rating-wrapper {
            display: flex;
            flex-direction: row-reverse;
            justify-content: center;
            margin-bottom: 15px;
        }

        .rating-wrapper input { display: none; }
        .rating-wrapper label {
            cursor: pointer;
            width: 45px;
            color: #ccc;
            font-size: 40px;
            transition: all 0.2s ease;
        }

        .rating-wrapper label:before { content: '★'; }
        .rating-wrapper input:checked ~ label,
        .rating-wrapper label:hover,
        .rating-wrapper label:hover ~ label {
            color: #ffca08;
            text-shadow: 0 0 10px rgba(255, 202, 8, 0.5);
            transform: scale(1.1);
        }

        textarea {
            width: 100%; height: 110px; padding: 15px; border-radius: 15px; 
            border: 1px solid rgba(0,0,0,0.1); resize: none; box-sizing: border-box; 
            font-family: inherit; font-size: 15px; background: rgba(255,255,255,0.8);
            transition: all 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: #0f828a;
            background: #fff;
            box-shadow: 0 0 10px rgba(15, 130, 138, 0.1);
        }

        .btn-submit {
            width: 100%; background: #0f828a; color: white; border: none; padding: 16px;
            border-radius: 15px; font-weight: 700; cursor: pointer; margin-top: 15px;
            box-shadow: 0 6px 20px rgba(15, 130, 138, 0.3);
            transition: all 0.3s ease;
            font-size: 16px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(15, 130, 138, 0.4);
            background: #0c6a70;
        }

        .footer-text { text-align: center; font-size: 13px; color: #555; margin-top: 30px; line-height: 1.6; }
        .btn-back-home { display: block; margin: 20px auto 0; padding: 10px 25px; background: white; border: 1px solid #0f828a; color: #0f828a; text-decoration: none; border-radius: 50px; font-weight: 700; width: fit-content; transition: 0.3s; }
        .btn-back-home:hover { background: #0f828a; color: white; }

        /* Animations */
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-15px);} }
        @keyframes glow { from { text-shadow: 0 0 5px #fff; } to { text-shadow: 0 0 15px #fff, 0 0 25px rgba(15, 130, 138, 0.4); } }
        
        @media (max-width: 480px) {
            .video-container { max-width: 100%; }
            .card { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="welcome-screen">
        <div class="cloud-btn-container" onclick="document.getElementById('main-content').scrollIntoView();">
            <div class="cloud-base">
                <span class="btn-enter-text">CHẠM</span>
            </div>
        </div>
        <div class="arrow">↓</div>
    </div>

    <div id="main-content" class="content-screen">
        <div class="card">
            <h2 class="main-title">Ghế Đá Kể Chuyện</h2>
            
            <div class="video-container">
               <iframe 
                 src="https://www.youtube.com/embed/Trzsbv4FEU8?rel=0&modestbranding=1&iv_load_policy=3" 
                 allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                 allowfullscreen>
                </iframe>
            </div>

            <div class="section">
                <div class="section-label">CLB và Group</div>
                <div class="selection-group">
                    <button class="btn-select active" onclick="changeImage('CLB', this)">Câu Lạc Bộ</button>
                    <button class="btn-select" onclick="changeImage('nhom', this)">Group</button>
                </div>
                <img id="main-image" src="./image/CLB.png" alt="Thực đơn" class="image-placeholder">
            </div>

            <div class="feedback-container">
                <form id="feedbackForm" action="https://formspree.io/f/mlgpoqzw" method="POST">
                    <h3 class="feedback-title">Giúp Tôi Nhé</h3>
                    <p style="text-align: center; margin: 0 0 15px 0; font-size: 14px; color: #555;">Mỗi góp ý là một lần chúng ta gần nhau hơn!</p>
                    
                    <div class="rating-wrapper">
                        <input type="radio" name="Danh_Gia_Sao" value="5" id="star5" required><label for="star5"></label>
                        <input type="radio" name="Danh_Gia_Sao" value="4" id="star4"><label for="star4"></label>
                        <input type="radio" name="Danh_Gia_Sao" value="3" id="star3"><label for="star3"></label>
                        <input type="radio" name="Danh_Gia_Sao" value="2" id="star2"><label for="star2"></label>
                        <input type="radio" name="Danh_Gia_Sao" value="1" id="star1"><label for="star1"></label>
                    </div>

                    <textarea name="Y_Kien_Dong_Gop" placeholder="Nhập nội dung của bạn tại đây..." required></textarea>
                    <button type="submit" id="submitBtn" class="btn-submit">GỬI PHẢN HỒI NGAY</button>
                </form>
            </div>
            
            <div class="footer-text">
                <strong>Dự án: Trạm Dừng Chia Sẻ</strong>
            </div>
            
            <a href="index.html" class="btn-back-home">Trở về trang chủ</a>
        </div> 
    </div> 

    <div id="custom-alert" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); backdrop-filter:blur(5px); justify-content:center; align-items:center; z-index:9999;">
        <div style="background:white; padding:30px; border-radius:25px; text-align:center; max-width:320px; width:85%;">
            <h3 style="font-family:'Pacifico', cursive; color:#0f828a; margin-top:0;">Trạm Dừng Chia Sẻ</h3>
            <p id="alert-message" style="color:#555;"></p>
            <button onclick="closeAlert()" style="background:#0f828a; color:white; border:none; padding:12px 35px; border-radius:50px; font-weight:bold; cursor:pointer;">Tuyệt vời</button>
        </div>
    </div>

    <script>
        function changeImage(type, element) {
            const img = document.getElementById('main-image');
            img.style.opacity = 0;
            setTimeout(() => {
                img.src = (type === 'CLB') ? 'image/CLB.png' : 'image/nhom.png';
                img.style.opacity = 1;
            }, 300);
            document.querySelectorAll('.btn-select').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }

        function showAlert(msg) {
            document.getElementById('alert-message').innerText = msg;
            document.getElementById('custom-alert').style.display = 'flex';
        }

        function closeAlert() { document.getElementById('custom-alert').style.display = 'none'; }

        const form = document.getElementById('feedbackForm');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async function(event) {
            event.preventDefault(); 
            const formData = new FormData(form);
            submitBtn.disabled = true;
            submitBtn.innerText = "ĐANG GỬI...";

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    showAlert("Cảm ơn bạn đã gửi nhận xét cho chúng mình!");
                    form.reset(); 
                } else {
                    showAlert("Rất tiếc, đã có lỗi xảy ra.");
                }
            } catch (error) {
                showAlert("Lỗi kết nối!");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "GỬI PHẢN HỒI NGAY";
            }
        });
    </script>
</body>
</html>
