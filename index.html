<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRẠM DỪNG CHIA SẺ</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            overflow-x: hidden;
            background-color: #000;
        }

        /* --- CHỈNH SỬA PHẦN NÀY --- */
        .background-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            /* Thay đổi đường dẫn ảnh của bạn tại đây */
            background: url('./image/bgr.png') no-repeat center center;
            background-size: cover;
            /* Hiệu ứng làm mờ và làm tối để nổi bật nội dung */
            filter: blur(10px) brightness(0.6); 
            transform: scale(1.1); /* Phóng to nhẹ để không lộ mép trắng khi blur */
        }

        /* Lớp phủ màu bổ trợ (giữ tông màu cũ của bạn nhưng mờ hơn) */
        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, rgba(102, 186, 234, 0.2) 0%, rgba(118, 75, 162, 0.3) 100%);
        }
        /* -------------------------- */

        .mobile-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            color: white;
        }

        .header-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            margin-bottom: 40px;
        }

        .logo-frame {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.3);
            padding: 3px;
            background: white;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
            animation: pulse 3s infinite;
            flex-shrink: 0;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            70% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .project-title {
            text-align: left;
            font-weight: 800;
            font-size: 1.2rem;
            line-height: 1.2;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .project-title span {
            font-weight: 400;
            font-size: 0.9rem;
            display: block;
            opacity: 0.8;
        }

        .nav-menu {
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 18px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .nav-item:active {
            transform: scale(0.95);
        }

        .icon {
            margin-right: 12px;
            font-size: 1.3rem;
            transition: transform 0.3s ease;
        }

        .nav-item:hover .icon {
            transform: scale(1.2);
        }

        .fanpage-link {
            margin-top: 25px;
            text-decoration: none;
            color: #fff;
            background: rgba(24, 119, 242, 0.4);
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .fanpage-link:hover {
            background: rgba(24, 119, 242, 0.7);
            transform: scale(1.05);
        }

        footer {
            margin-top: auto;
            padding-top: 40px;
            font-size: 0.8rem;
            opacity: 0.7;
            font-weight: 400;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="background-image"></div>
    <div class="background-overlay"></div>
    
    <main class="mobile-wrapper">
        <div class="header-section">
            <div class="logo-frame">
                <img src="image/logo.jpg" alt="Logo" class="logo">
            </div>
            <h1 class="project-title">TRẠM DỪNG CHIA SẺ<br><span>Đồ án Truyền thông HUSC</span></h1>
        </div>

        <nav class="nav-menu">
            <a href="gheda.html" class="nav-item">
                <span class="icon">🪑</span> Ghế Đá Kể Chuyện
            </a>
            <a href="thuvien.html" class="nav-item">
                <span class="icon">📚</span> Thư Viện Thì Thầm
            </a>
            <a href="khutuhoc.html" class="nav-item">
                <span class="icon">📖</span> Khu Tự Học Đồng Hành
            </a>
            <a href="cantin.html" class="nav-item">
                <span class="icon">☕</span> Căn Tin Nói Nhỏ
            </a>
        </nav>

        <a href="https://www.facebook.com/profile.php?id=61582760764871" target="_blank" class="fanpage-link">
            <i class="fa-brands fa-facebook-f"></i> Ghé thăm Fanpage của chúng mình
        </a>

        <footer>
            <p>© Sinh Viên Đại Học Khoa Học Huế</p>
        </footer>
    </main>

    <script src="https://cdn.counter.dev/script.js" data-id="8fd83ba6-8c46-48e4-b128-1eea71c01841" data-utcoffset="7"></script>
    
    <script src="https://kit.fontawesome.com/582a72f652.js" crossorigin="anonymous"></script>
</body>
</html>
