<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KHU TỰ HỌC</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Reset & Base */
        body, html { 
            margin: 0; padding: 0; 
            font-family: 'Quicksand', sans-serif; 
            scroll-behavior: smooth; 
            overflow-x: hidden; 
            background: #f4f4f9;
        }
        
        /* GIAI ĐOẠN 1: Màn hình chào */
        .welcome-screen {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.3)), url('./image/bgr.png'); 
            background-size: cover;
            background-position: center;
            color: white;
            text-align: center;
        }

        .cloud-btn-container {
            position: relative;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 20px; 
            animation: float 3s ease-in-out infinite;
        }

        .cloud-base {
            width: 160px; height: 70px;
            background: white; border-radius: 50px;
            position: relative; display: flex;
            justify-content: center; align-items: center;
        }

        .cloud-base::before { content: ''; position: absolute; width: 80px; height: 80px; background: white; border-radius: 50%; top: -40px; left: 20px; }
        .cloud-base::after { content: ''; position: absolute; width: 100px; height: 100px; background: white; border-radius: 50%; top: -55px; right: 15px; }

        .btn-enter-text { font-size: 24px; font-weight: bold; color: #4ed190; z-index: 10; letter-spacing: 2px; }
        .arrow { font-size: 40px; margin-top: 30px; animation: bounce 2s infinite; color: white; }
        
        /* GIAI ĐOẠN 2: Nội dung chính */
        .content-screen { min-height: 100vh; padding: 40px 20px; display: flex; justify-content: center; }

        .card {
            background: linear-gradient(135deg, #dff5f0 0%, #e0e7ff 100%);
            width: 100%; max-width: 500px;
            border-radius: 30px; padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            display: flex; flex-direction: column;
            animation: fadeInUp 1s ease-out;
            box-sizing: border-box; /* Đảm bảo padding không làm tăng chiều rộng card */
        }

        .main-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 36px;
            color: #265871;
            text-align: center;
            margin: 0 0 25px 0;
            animation: glow 2s ease-in-out infinite alternate;
            letter-spacing: 1px;   /* giãn chữ */
            line-height: 1.2;
        }

        /* --- VIDEO YOUTUBE DỌC --- */
        .video-container {
            width: 100%;
            max-width: 320px; 
            margin: 0 auto 25px;
            border-radius: 20px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            aspect-ratio: 9 / 16;
            position: relative;
        }

        .video-container iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
            object-fit: cover;
        }

        /* --- UI Components --- */
        .section-label { font-size: 20px; font-weight: 700; color: #0c6a70; margin-bottom: 15px; text-align: center; }
        
        .selection-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-select {
            padding: 12px 8px; border: 2px solid transparent;
            background: rgba(255, 255, 255, 0.3); color: #0c6a70;
            border-radius: 15px; cursor: pointer; font-weight: 700;
            transition: all 0.3s ease; backdrop-filter: blur(5px);
            font-size: 13px;
        }

        .btn-select.active { background: #0f828a; color: white; transform: translateY(-3px); box-shadow: 0 8px 15px rgba(15, 130, 138, 0.3); }

        /* SỬA LỖI TRÀN ẢNH GIẢI PHÁP */
        .image-placeholder { 
            width: 100%; 
            max-width: 100%; 
            height: auto; 
            border-radius: 20px; 
            transition: all 0.4s ease; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.1); 
            display: block;
        }

        /* --- PHẦN HỘP QUÀ --- */
        .gift-section { text-align: center; margin: 30px 0; position: relative; }
        .gift-hint { font-size: 15px; color: #0f828a; font-weight: bold; margin-bottom: 8px; }
        .gift-box { width: 85px; cursor: pointer; transition: transform 0.3s ease; animation: gift-shake 2s infinite; }
        .gift-arrow { font-size: 24px; color: #0f828a; display: block; margin-bottom: 5px; animation: bounce 1.5s infinite; }
        
        .gift-modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); 
            justify-content: center; align-items: center; z-index: 10000; 
        }
        
        .gift-content { 
            max-width: 85%; 
            width: 400px; /* Khống chế chiều rộng tối đa của modal quà */
            position: relative; 
            animation: fadeInUp 0.5s ease; 
            text-align: center; 
        }

        /* SỬA LỖI TRÀN ẢNH TRONG MODAL */
        .gift-content img { 
            width: 100%; 
            max-height: 70vh; /* Không để ảnh cao quá màn hình */
            object-fit: contain;
            border-radius: 20px; 
            border: 4px solid white; 
            box-shadow: 0 0 20px rgba(255,255,255,0.3); 
        }

        .close-gift { position: absolute; top: -45px; right: 0; color: white; font-size: 35px; cursor: pointer; }

        /* Feedback */
        .feedback-container { background: rgba(255,255,255,0.5); backdrop-filter: blur(15px); padding: 25px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.6); margin-top: 20px; }
        .feedback-title { font-family: 'Pacifico', cursive; font-size: 24px; color: #0f828a; text-align: center; }
        
       .rating-wrapper {
            display: flex;
            flex-direction: row-reverse;
            justify-content: center;
            margin-bottom: 15px;
        }

        .rating-wrapper input { display: none; }
        .rating-wrapper label {
            cursor: pointer;
            width: 45px;
            color: #ccc;
            font-size: 40px;
            transition: all 0.2s ease;
        }

        .rating-wrapper label:before { content: '★'; }
        .rating-wrapper input:checked ~ label,
        .rating-wrapper label:hover,
        .rating-wrapper label:hover ~ label {
            color: #ffca08;
            text-shadow: 0 0 10px rgba(255, 202, 8, 0.5);
            transform: scale(1.1);
        }
        textarea { width: 100%; height: 110px; padding: 15px; border-radius: 15px; border: 1px solid rgba(0,0,0,0.1); resize: none; box-sizing: border-box; font-family: inherit; }
        .btn-submit { width: 100%; background: #0f828a; color: white; border: none; padding: 16px; border-radius: 15px; font-weight: 700; cursor: pointer; margin-top: 15px; font-size: 16px; }

        .footer-text { text-align: center; font-size: 13px; color: #555; margin-top: 30px; }
        .btn-back-home { display: block; margin: 20px auto 0; padding: 10px 25px; background: white; border: 1px solid #0f828a; color: #0f828a; text-decoration: none; border-radius: 50px; font-weight: 700; width: fit-content; }

        /* Animations */
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-15px);} }
        @keyframes glow { from { text-shadow: 0 0 5px #fff; } to { text-shadow: 0 0 15px #fff, 0 0 25px rgba(15, 130, 138, 0.4); } }
        @keyframes gift-shake {
            0%, 100% { transform: rotate(0); }
            10%, 30%, 50% { transform: rotate(-8deg); }
            20%, 40%, 60% { transform: rotate(8deg); }
            70% { transform: rotate(0); }
        }
        
        @media (max-width: 480px) {
            .card { padding: 15px; }
            .selection-group { gap: 8px; }
            .btn-select { font-size: 11px; padding: 10px 5px; }
        }
    </style>
</head>
<body>

    <div class="welcome-screen">
        <div class="cloud-btn-container" onclick="document.getElementById('main-content').scrollIntoView();">
            <div class="cloud-base">
                <span class="btn-enter-text">CHẠM</span>
            </div>
        </div>
        <div class="arrow">↓</div>
    </div>

    <div id="main-content" class="content-screen">
        <div class="card">
            <h2 class="main-title">Khu Tự Học Đồng Hành</h2>
            
            <div class="video-container">
               <iframe
                 src="https://www.youtube.com/embed/FGD9J0gG3Wo?rel=0&modestbranding=1&iv_load_policy=3"
                 allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                 allowfullscreen>
                </iframe>
            </div>

            <div class="section">
                <div class="section-label">Các giải pháp giúp bạn đây</div>
                <div class="selection-group">
                    <button class="btn-select active" onclick="changeImage('tri-hoan', this)">Bạn Hay Trì Hoãn</button>
                    <button class="btn-select" onclick="changeImage('hoc-tu-dau', this)">Bạn Không Biết Học Từ Đâu</button>
                    <button class="btn-select" onclick="changeImage('mat-tap-trung', this)">Bạn Dễ Mất Tập Trung</button>
                    <button class="btn-select" onclick="changeImage('dong-luc', this)">Bạn Không có Động Lực</button>
                </div>
                <div style="width: 100%; overflow: hidden;">
                    <img id="main-image" src="./image/trihoan.png" alt="Giải pháp" class="image-placeholder">
                </div>
            </div>

            <div class="gift-section">
                <div class="gift-hint">Nhận một món quà nhỏ nhé!</div>
                <div class="gift-arrow">↓</div>
                <img src="https://cdn-icons-png.flaticon.com/512/4213/4213958.png" class="gift-box" onclick="openGift()" alt="Hộp quà">
            </div>

            <div class="feedback-container">
                <form id="feedbackForm" action="https://formspree.io/f/mlgpoqzw" method="POST">
                    <h3 class="feedback-title">Giúp Tôi Nhé</h3>
                    <p style="text-align: center; margin: 0 0 15px 0; font-size: 14px; color: #555;">Mỗi góp ý là một lần chúng ta gần nhau hơn!</p>
                    
                    <div class="rating-wrapper">
                        <input type="radio" name="Danh_Gia_Sao" value="5" id="star5" required><label for="star5"></label>
                        <input type="radio" name="Danh_Gia_Sao" value="4" id="star4"><label for="star4"></label>
                        <input type="radio" name="Danh_Gia_Sao" value="3" id="star3"><label for="star3"></label>
                        <input type="radio" name="Danh_Gia_Sao" value="2" id="star2"><label for="star2"></label>
                        <input type="radio" name="Danh_Gia_Sao" value="1" id="star1"><label for="star1"></label>
                    </div>

                    <textarea name="Y_Kien_Dong_Gop" placeholder="Nhập nội dung của bạn tại đây..." required></textarea>
                    <button type="submit" id="submitBtn" class="btn-submit">GỬI PHẢN HỒI NGAY</button>
                </form>
            </div>
            
            <div class="footer-text">
                <strong>Dự án: Trạm Dừng Chia Sẻ</strong>
            </div>
            
            <a href="index.html" class="btn-back-home">Trở về trang chủ</a>
        </div> 
    </div> 

    <div id="giftModal" class="gift-modal" onclick="closeGift()">
        <div class="gift-content" onclick="event.stopPropagation()">
            <span class="close-gift" onclick="closeGift()">&times;</span>
            <img src="./image/qua.png" alt="Quà tặng">
            <p style="color: white; margin-top: 15px; font-family: 'Pacifico'; font-size: 20px;">Cố gắng lên bạn nhé! ✨</p>
        </div>
    </div>

    <div id="custom-alert" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); backdrop-filter:blur(5px); justify-content:center; align-items:center; z-index:9999;">
        <div style="background:white; padding:30px; border-radius:25px; text-align:center; max-width:320px; width:85%;">
            <h3 style="font-family:'Pacifico', cursive; color:#0f828a; margin-top:0;">Trạm Dừng Chia Sẻ</h3>
            <p id="alert-message" style="color:#555;"></p>
            <button onclick="closeAlert()" style="background:#0f828a; color:white; border:none; padding:12px 35px; border-radius:50px; font-weight:bold; cursor:pointer;">Tuyệt vời</button>
        </div>
    </div>

    <script>
        function changeImage(type, element) {
            const img = document.getElementById('main-image');
            img.style.opacity = 0;
            setTimeout(() => {
                switch(type) {
                    case 'tri-hoan': img.src = 'image/trihoan.png'; break;
                    case 'hoc-tu-dau': img.src = 'image/hoctudau.png'; break;
                    case 'mat-tap-trung': img.src = 'image/taptrung.png'; break;
                    case 'dong-luc': img.src = 'image/dongluc.png'; break;
                }
                img.style.opacity = 1;
            }, 300);
            document.querySelectorAll('.btn-select').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }

        function openGift() {
            document.getElementById('giftModal').style.display = 'flex';
        }

        function closeGift() {
            document.getElementById('giftModal').style.display = 'none';
        }

        function showAlert(msg) {
            document.getElementById('alert-message').innerText = msg;
            document.getElementById('custom-alert').style.display = 'flex';
        }

        function closeAlert() { document.getElementById('custom-alert').style.display = 'none'; }

        const form = document.getElementById('feedbackForm');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async function(event) {
            event.preventDefault(); 
            const formData = new FormData(form);
            submitBtn.disabled = true;
            submitBtn.innerText = "ĐANG GỬI...";

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    showAlert("Cảm ơn bạn đã gửi nhận xét cho chúng mình!");
                    form.reset(); 
                } else {
                    showAlert("Rất tiếc, đã có lỗi xảy ra.");
                }
            } catch (error) {
                showAlert("Lỗi kết nối!");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "GỬI PHẢN HỒI NGAY";
            }
        });
    </script>
</body>
</html>
